# ROS2 bridge configuration for Create 3 navigation simulation.
#
# NOTE: This file is reference documentation only — SimBridgeNode does NOT load it
# at runtime. The operative constants are hardcoded in sim_bridge_node.py:
#   WHEEL_BASE = 0.233, WHEEL_RADIUS = 0.036
# To change kinematic parameters, edit those constants directly.

# iRobot Create 3 kinematic parameters
robot:
  wheel_base: 0.233      # metres between wheel centres
  wheel_radius: 0.036    # metres
  max_linear_vel: 0.226  # m/s  (= max_wheel_vel 6.28 rad/s × wheel_radius 0.036 m)
  max_angular_vel: 1.9   # rad/s

# Topic names
topics:
  scan: "/scan"
  odom: "/odom"
  rgb_image: "/camera/rgb/image_raw"
  depth_image: "/camera/depth/image_raw"
  occupancy_grid: "/occupancy_grid"
  cmd_vel: "/cmd_vel"
  goal_pose: "/goal_pose"

# Frame IDs for TF
frames:
  base: "base_link"
  odom: "odom"
  camera: "camera_link"
  lidar: "laser_frame"
  map: "map"

# Safety timeout: zero cmd_vel if no message received within this period (seconds)
cmd_vel_timeout: 0.5

# Teleop defaults
teleop:
  linear_vel: 0.3        # m/s per keypress
  angular_vel: 1.0       # rad/s per keypress
